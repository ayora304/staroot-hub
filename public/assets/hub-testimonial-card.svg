<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 661" width="838" height="661" role="img" aria-labelledby="t-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
